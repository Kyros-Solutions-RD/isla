name: Isla
options:
  bundleIdPrefix: com.kyrossolutions
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true
  developmentLanguage: en
  groupSortPosition: top
packages:
  SwiftTerm:
    url: https://github.com/migueldeicaza/SwiftTerm
    from: 1.2.0
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    from: 2.6.0
settings:
  base:
    MARKETING_VERSION: "1.0.2"
    CURRENT_PROJECT_VERSION: "4"
    SWIFT_VERSION: "5.0"
    MACOSX_DEPLOYMENT_TARGET: "26.0"
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    DEAD_CODE_STRIPPING: YES
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGN_STYLE: Manual
    DEVELOPMENT_TEAM: ""
targets:
  IslaMediaBridge:
    type: library.dynamic
    platform: macOS
    sources:
      - path: MediaBridge
        excludes:
          - "*.pl"
    settings:
      base:
        PRODUCT_NAME: IslaMediaBridge
        EXECUTABLE_PREFIX: lib
        DYLIB_INSTALL_NAME_BASE: "@rpath"
        CLANG_ENABLE_OBJC_ARC: YES
        SKIP_INSTALL: YES
        GCC_SYMBOLS_PRIVATE_EXTERN: YES
  Isla:
    type: application
    platform: macOS
    sources:
      - path: Isla
      - path: MediaBridge/isla-media.pl
        buildPhase: resources
    dependencies:
      - target: IslaMediaBridge
        embed: true
        link: false
        codeSign: true
      - package: SwiftTerm
      - package: Sparkle
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.kyrossolutions.isla
        PRODUCT_NAME: Isla
        INFOPLIST_FILE: Isla/Resources/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_ENTITLEMENTS: Isla/Resources/Isla.entitlements
        ENABLE_HARDENED_RUNTIME: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/../Frameworks"
        SWIFT_EMIT_LOC_STRINGS: YES
        LOCALIZATION_PREFERS_STRING_CATALOGS: YES
        COMBINE_HIDPI_IMAGES: YES
        SWIFT_STRICT_CONCURRENCY: minimal
        ISLA_UPDATE_FEED_URL: "https://isla.kyrosrd.com/updates/appcast.xml"
        ISLA_SPARKLE_PUBLIC_KEY: "F1Iym983uii8gz8DGoGQJ2VaPpyN1o0IL+UoPKkdYkk="
schemes:
  Isla:
    build:
      targets:
        Isla: all
    run:
      config: Debug
    archive:
      config: Release
